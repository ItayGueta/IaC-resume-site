<svg class="hero-shapes__svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hs-glow-cyan"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="hs-glow-amber"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="hs-glow-subtle"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- ============================================================
       LAYER 1: Pipeline DAG (bottom, horizontal flow)
       ============================================================ -->
  <g opacity="0.35">
    <!-- Main pipeline trunk -->
    <line x1="100" y1="700" x2="1280" y2="700" stroke="#2556d8" stroke-opacity="0.3" stroke-width="2"/>
    <!-- Branch: CI triggers → a parallel task -->
    <line x1="350" y1="700" x2="500" y2="620" stroke="#2556d8" stroke-opacity="0.15" stroke-width="1.5"/>
    <line x1="500" y1="620" x2="650" y2="620" stroke="rgba(240,75,47,0.2)" stroke-width="1.5"/>
    <line x1="650" y1="620" x2="750" y2="700" stroke="#2556d8" stroke-opacity="0.15" stroke-width="1.5"/>
    <!-- Merge point -->
    <circle cx="750" cy="700" r="5" fill="none" stroke="#2556d8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Stage nodes on main trunk -->
    <circle cx="200" cy="700" r="6" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>
    <circle cx="450" cy="700" r="6" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>
    <circle cx="650" cy="700" r="6" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>
    <circle cx="900" cy="700" r="6" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>
    <circle cx="1100" cy="700" r="7" fill="#2556d8" fill-opacity="0.55" filter="url(#hs-glow-subtle)"/>
    <!-- Terminal result node (amber) -->
    <circle cx="1280" cy="700" r="8" fill="#f04b2f" fill-opacity="0.5" filter="url(#hs-glow-amber)"/>

    <!-- Branch node -->
    <circle cx="350" cy="700" r="4" fill="#2556d8" fill-opacity="0.4"/>
    <circle cx="500" cy="620" r="6" fill="#2556d8" fill-opacity="0.45" filter="url(#hs-glow-subtle)"/>
    <circle cx="650" cy="620" r="5" fill="rgba(240,75,47,0.4)"/>
  </g>

  <!-- ============================================================
       LAYER 2: Neural net (upper left)
       ============================================================ -->
  <g opacity="0.4">
    <!-- Input layer (5 nodes) -->
    <circle cx="150" cy="200" r="4" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="150" cy="250" r="4" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="150" cy="300" r="4" fill="#2556d8" fill-opacity="0.55"/>
    <circle cx="150" cy="350" r="4" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="150" cy="400" r="4" fill="#2556d8" fill-opacity="0.45"/>

    <!-- Hidden layer 1 (4 nodes) -->
    <circle cx="280" cy="215" r="5" fill="#2556d8" fill-opacity="0.55" filter="url(#hs-glow-subtle)"/>
    <circle cx="280" cy="270" r="5" fill="#2556d8" fill-opacity="0.6" filter="url(#hs-glow-subtle)"/>
    <circle cx="280" cy="325" r="5" fill="#2556d8" fill-opacity="0.6" filter="url(#hs-glow-subtle)"/>
    <circle cx="280" cy="380" r="5" fill="#2556d8" fill-opacity="0.55" filter="url(#hs-glow-subtle)"/>

    <!-- connections L0→L1 (selected, not all-to-all) -->
    <line x1="150" y1="200" x2="280" y2="215" stroke="#2556d8" stroke-opacity="0.08" stroke-width="0.8"/>
    <line x1="150" y1="200" x2="280" y2="270" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="150" y1="250" x2="280" y2="270" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="150" y1="250" x2="280" y2="325" stroke="#2556d8" stroke-opacity="0.08" stroke-width="0.8"/>
    <line x1="150" y1="300" x2="280" y2="270" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="150" y1="300" x2="280" y2="325" stroke="#2556d8" stroke-opacity="0.13" stroke-width="0.8"/>
    <line x1="150" y1="300" x2="280" y2="380" stroke="#2556d8" stroke-opacity="0.08" stroke-width="0.8"/>
    <line x1="150" y1="350" x2="280" y2="325" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="150" y1="350" x2="280" y2="380" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="150" y1="400" x2="280" y2="380" stroke="#2556d8" stroke-opacity="0.08" stroke-width="0.8"/>

    <!-- Hidden layer 2 (3 nodes) — compressed, leading to output -->
    <circle cx="400" cy="240" r="5" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>
    <circle cx="400" cy="300" r="5" fill="#2556d8" fill-opacity="0.55" filter="url(#hs-glow-subtle)"/>
    <circle cx="400" cy="360" r="5" fill="#2556d8" fill-opacity="0.5" filter="url(#hs-glow-subtle)"/>

    <!-- connections L1→L2 -->
    <line x1="280" y1="215" x2="400" y2="240" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="280" y1="270" x2="400" y2="240" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="280" y1="270" x2="400" y2="300" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="280" y1="325" x2="400" y2="300" stroke="#2556d8" stroke-opacity="0.13" stroke-width="0.8"/>
    <line x1="280" y1="325" x2="400" y2="360" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>
    <line x1="280" y1="380" x2="400" y2="360" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8"/>

    <!-- Output: 2 amber nodes — the result of the network -->
    <circle cx="490" cy="260" r="6" fill="#f04b2f" fill-opacity="0.45" filter="url(#hs-glow-amber)"/>
    <circle cx="490" cy="340" r="6" fill="#f04b2f" fill-opacity="0.4" filter="url(#hs-glow-amber)"/>

    <line x1="400" y1="240" x2="490" y2="260" stroke="rgba(240,75,47,0.12)" stroke-width="0.8"/>
    <line x1="400" y1="300" x2="490" y2="260" stroke="rgba(240,75,47,0.1)" stroke-width="0.8"/>
    <line x1="400" y1="300" x2="490" y2="340" stroke="rgba(240,75,47,0.1)" stroke-width="0.8"/>
    <line x1="400" y1="360" x2="490" y2="340" stroke="rgba(240,75,47,0.12)" stroke-width="0.8"/>
  </g>

  <!-- ============================================================
       LAYER 3: K8s-style pod mesh (right side, mid-height)
       ============================================================ -->
  <g opacity="0.35">
    <!-- Pod cluster A (3 pods, 1 service) -->
    <circle cx="950" cy="280" r="5" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="990" cy="260" r="5" fill="#2556d8" fill-opacity="0.55"/>
    <circle cx="980" cy="310" r="5" fill="#2556d8" fill-opacity="0.45"/>
    <!-- Service ring A -->
    <circle cx="975" cy="280" r="14" stroke="#2556d8" stroke-opacity="0.3" stroke-width="1.2" fill="none"/>
    <!-- Pod→service connections -->
    <line x1="950" y1="280" x2="962" y2="280" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.6"/>
    <line x1="990" y1="260" x2="978" y2="270" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.6"/>
    <line x1="980" y1="310" x2="970" y2="292" stroke="#2556d8" stroke-opacity="0.12" stroke-width="0.6"/>

    <!-- Pod cluster B (2 pods, 1 service) — smaller -->
    <circle cx="1100" cy="320" r="4" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="1130" cy="340" r="4" fill="#2556d8" fill-opacity="0.55"/>
    <circle cx="1115" cy="330" r="10" stroke="#2556d8" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <line x1="1100" y1="320" x2="1108" y2="326" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.6"/>
    <line x1="1130" y1="340" x2="1120" y2="335" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.6"/>

    <!-- Cross-service communication — edge between cluster A and B -->
    <line x1="988" y1="280" x2="1115" y2="330" stroke="#2556d8" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="4 8"/>

    <!-- Pod cluster C (top right, 2 pods + ingress ring, amber output) -->
    <circle cx="1020" cy="180" r="4" fill="#2556d8" fill-opacity="0.45"/>
    <circle cx="1060" cy="170" r="4" fill="#2556d8" fill-opacity="0.5"/>
    <!-- Ingress — larger open ring -->
    <circle cx="1040" cy="175" r="18" stroke="rgba(6,182,212,0.2)" stroke-width="1" fill="none"/>
    <!-- Output from this cluster (amber) -->
    <circle cx="1090" cy="180" r="5" fill="#f04b2f" fill-opacity="0.4" filter="url(#hs-glow-amber)"/>
    <line x1="1040" y1="175" x2="1090" y2="180" stroke="rgba(240,75,47,0.15)" stroke-width="0.8"/>
  </g>

  <!-- ============================================================
       SCATTERED: Open rings (tools / exposed interfaces)
       ============================================================ -->
  <g opacity="0.25">
    <circle cx="600" cy="180" r="7" stroke="#2556d8" stroke-opacity="0.4" stroke-width="1" fill="none"/>
    <circle cx="620" cy="480" r="5" stroke="rgba(240,75,47,0.3)" stroke-width="1" fill="none"/>
    <circle cx="850" cy="520" r="6" stroke="#2556d8" stroke-opacity="0.3" stroke-width="1" fill="none"/>
    <circle cx="250" cy="520" r="5" stroke="#2556d8" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <circle cx="1150" cy="480" r="4" stroke="rgba(240,75,47,0.25)" stroke-width="1" fill="none"/>
  </g>

  <!-- ============================================================
       Sparse small dots (idle agents / sidecars)
       ============================================================ -->
  <g opacity="0.2">
    <circle cx="550" cy="150" r="2" fill="#2556d8" fill-opacity="0.6"/>
    <circle cx="700" cy="500" r="2" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="450" cy="550" r="2" fill="rgba(240,75,47,0.4)"/>
    <circle cx="880" cy="130" r="2" fill="#2556d8" fill-opacity="0.5"/>
    <circle cx="120" cy="550" r="2" fill="#2556d8" fill-opacity="0.4"/>
    <circle cx="1050" cy="550" r="2" fill="rgba(240,75,47,0.35)"/>
    <circle cx="1300" cy="350" r="2" fill="#2556d8" fill-opacity="0.45"/>
  </g>
</svg>
